[build]
  command = "npm run build:web"
  publish = "dist/web"

[build.environment]
  # Electron 네이티브 모듈 빌드 스킵 (웹 빌드에서는 불필요)
  NPM_FLAGS = "--ignore-scripts"
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
