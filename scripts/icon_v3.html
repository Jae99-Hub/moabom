<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>* { margin:0; padding:0; } html,body { width:256px; height:256px; overflow:hidden; background:transparent; }</style>
</head>
<body>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#F0EAFF"/>
    <stop offset="100%" stop-color="#FFE4EE"/>
  </linearGradient>

  <linearGradient id="card1" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#4FC3F7"/>
    <stop offset="100%" stop-color="#0288D1"/>
  </linearGradient>
  <linearGradient id="card2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#CE93D8"/>
    <stop offset="100%" stop-color="#8E24AA"/>
  </linearGradient>
  <linearGradient id="card3" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#FF8A9A"/>
    <stop offset="100%" stop-color="#E91E63"/>
  </linearGradient>

  <filter id="sh">
    <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0000001A"/>
  </filter>

  <clipPath id="rnd">
    <rect width="256" height="256" rx="54" ry="54"/>
  </clipPath>
</defs>

<g clip-path="url(#rnd)">

<!-- Background -->
<rect width="256" height="256" fill="url(#bg)"/>
<!-- Soft top glow -->
<radialGradient id="tg" cx="50%" cy="0%" r="70%">
  <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
  <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
</radialGradient>
<rect width="256" height="256" fill="url(#tg)"/>


<!-- ── 3 Fanned cards ── -->

<!-- Left card (Book) — rotated left -->
<g transform="translate(128,138) rotate(-22)" filter="url(#sh)">
  <rect x="-38" y="-54" width="76" height="100" rx="14" fill="url(#card1)"/>
  <!-- Gloss -->
  <rect x="-38" y="-54" width="76" height="34" rx="14" fill="white" opacity="0.14"/>
  <!-- Book icon: two pages -->
  <rect x="-28" y="-36" width="22" height="28" rx="4" fill="white" opacity="0.92"/>
  <rect x="  6" y="-36" width="22" height="28" rx="4" fill="white" opacity="0.92"/>
  <rect x=" -4" y="-38" width=" 8" height="32" rx="4" fill="white" opacity="0.55"/>
  <!-- Page lines -->
  <rect x="-26" y="-30" width="16" height="2.2" rx="1" fill="#0288D1" opacity="0.38"/>
  <rect x="-26" y="-25" width="16" height="2.2" rx="1" fill="#0288D1" opacity="0.38"/>
  <rect x="-26" y="-20" width="11" height="2.2" rx="1" fill="#0288D1" opacity="0.38"/>
  <rect x="  8" y="-30" width="16" height="2.2" rx="1" fill="#0288D1" opacity="0.38"/>
  <rect x="  8" y="-25" width="16" height="2.2" rx="1" fill="#0288D1" opacity="0.38"/>
  <rect x="  8" y="-20" width="11" height="2.2" rx="1" fill="#0288D1" opacity="0.38"/>
</g>

<!-- Right card (Drama/TV) — rotated right -->
<g transform="translate(128,138) rotate(22)" filter="url(#sh)">
  <rect x="-38" y="-54" width="76" height="100" rx="14" fill="url(#card3)"/>
  <!-- Gloss -->
  <rect x="-38" y="-54" width="76" height="34" rx="14" fill="white" opacity="0.14"/>
  <!-- TV icon -->
  <rect x="-28" y="-36" width="56" height="36" rx="5" fill="white" opacity="0.92"/>
  <!-- Screen -->
  <rect x="-24" y="-32" width="48" height="28" rx="3" fill="#E91E63" opacity="0.18"/>
  <!-- Play triangle -->
  <polygon points="-8,-20  -8,-4  8,-12" fill="white" opacity="0.85"/>
  <!-- Antenna -->
  <line x1="-12" y1="-36" x2="-18" y2="-46" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.82"/>
  <line x1=" 12" y1="-36" x2=" 18" y2="-46" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.82"/>
  <circle cx="-18" cy="-46" r="3" fill="white" opacity="0.75"/>
  <circle cx=" 18" cy="-46" r="3" fill="white" opacity="0.75"/>
  <!-- Stand -->
  <rect x="-8" y="0" width="16" height="4" rx="2" fill="white" opacity="0.55"/>
  <rect x="-14" y="4" width="28" height="4" rx="2" fill="white" opacity="0.48"/>
</g>

<!-- Center card (Movie) — upright, on top -->
<g transform="translate(128,132)" filter="url(#sh)">
  <rect x="-42" y="-62" width="84" height="110" rx="16" fill="url(#card2)"/>
  <!-- Gloss -->
  <rect x="-42" y="-62" width="84" height="38" rx="16" fill="white" opacity="0.14"/>
  <!-- Film strip at top -->
  <rect x="-36" y="-54" width="10" height="12" rx="2.5" fill="white" opacity="0.40"/>
  <rect x="-22" y="-54" width="10" height="12" rx="2.5" fill="white" opacity="0.40"/>
  <rect x=" -8" y="-54" width="10" height="12" rx="2.5" fill="white" opacity="0.40"/>
  <rect x="  6" y="-54" width="10" height="12" rx="2.5" fill="white" opacity="0.40"/>
  <rect x=" 20" y="-54" width="16" height="12" rx="2.5" fill="white" opacity="0.40"/>
  <!-- Play circle -->
  <circle cx="0" cy="-8" r="26" fill="white" opacity="0.16"/>
  <circle cx="0" cy="-8" r="20" fill="white" opacity="0.90"/>
  <polygon points="-5,-18 -5,2 14,-8" fill="#8E24AA" opacity="0.88"/>
</g>

</g>
</svg>
</body>
</html>
