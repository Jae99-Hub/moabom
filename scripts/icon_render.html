<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 256px; height: 256px; background: transparent; overflow: hidden; }
</style>
</head>
<body>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF9F4"/>
      <stop offset="100%" stop-color="#F4EBE0"/>
    </linearGradient>
    <linearGradient id="boxFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E2E56"/>
      <stop offset="100%" stop-color="#0E1A35"/>
    </linearGradient>
    <linearGradient id="boxRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B1228"/>
      <stop offset="100%" stop-color="#080D1C"/>
    </linearGradient>
    <linearGradient id="boxTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2C4480"/>
      <stop offset="100%" stop-color="#1E2E56"/>
    </linearGradient>
    <radialGradient id="interior" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#B06BFF"/>
      <stop offset="35%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#0D0820"/>
    </radialGradient>
    <radialGradient id="openGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#7C3AED" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#4C1D95" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bookG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="movieG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8B4FE"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="dramaG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCA5A5"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#00000030"/>
    </filter>
    <filter id="glowBlur">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="round">
      <rect width="256" height="256" rx="46" ry="46"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <!-- Background -->
    <rect width="256" height="256" fill="url(#bg)"/>

    <!-- Subtle radial light at center-top (depth effect) -->
    <radialGradient id="depthLight" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <rect width="256" height="256" fill="url(#depthLight)"/>

    <!-- ── Cherry blossoms ── -->
    <!-- Top-left -->
    <g transform="translate(30,28)" opacity="0.78">
      <g transform="rotate(0)"><ellipse cx="0" cy="-10" rx="8.5" ry="5.5" fill="#FFB3C6"/></g>
      <g transform="rotate(72)"><ellipse cx="0" cy="-10" rx="8.5" ry="5.5" fill="#FFB3C6"/></g>
      <g transform="rotate(144)"><ellipse cx="0" cy="-10" rx="8.5" ry="5.5" fill="#FFB3C6"/></g>
      <g transform="rotate(216)"><ellipse cx="0" cy="-10" rx="8.5" ry="5.5" fill="#FFB3C6"/></g>
      <g transform="rotate(288)"><ellipse cx="0" cy="-10" rx="8.5" ry="5.5" fill="#FFB3C6"/></g>
      <circle r="3.5" fill="#FF8FA3"/>
    </g>
    <!-- Top-right -->
    <g transform="translate(224,36)" opacity="0.68">
      <g transform="rotate(20)"><ellipse cx="0" cy="-8.5" rx="7.5" ry="5" fill="#FFC0CB"/></g>
      <g transform="rotate(92)"><ellipse cx="0" cy="-8.5" rx="7.5" ry="5" fill="#FFC0CB"/></g>
      <g transform="rotate(164)"><ellipse cx="0" cy="-8.5" rx="7.5" ry="5" fill="#FFC0CB"/></g>
      <g transform="rotate(236)"><ellipse cx="0" cy="-8.5" rx="7.5" ry="5" fill="#FFC0CB"/></g>
      <g transform="rotate(308)"><ellipse cx="0" cy="-8.5" rx="7.5" ry="5" fill="#FFC0CB"/></g>
      <circle r="3" fill="#FF8FA3"/>
    </g>
    <!-- Bottom-left small -->
    <g transform="translate(20,215)" opacity="0.55">
      <g transform="rotate(10)"><ellipse cx="0" cy="-7" rx="6.5" ry="4" fill="#FFD0DC"/></g>
      <g transform="rotate(82)"><ellipse cx="0" cy="-7" rx="6.5" ry="4" fill="#FFD0DC"/></g>
      <g transform="rotate(154)"><ellipse cx="0" cy="-7" rx="6.5" ry="4" fill="#FFD0DC"/></g>
      <g transform="rotate(226)"><ellipse cx="0" cy="-7" rx="6.5" ry="4" fill="#FFD0DC"/></g>
      <g transform="rotate(298)"><ellipse cx="0" cy="-7" rx="6.5" ry="4" fill="#FFD0DC"/></g>
      <circle r="2.5" fill="#FF8FA3"/>
    </g>
    <!-- Bottom-right tiny -->
    <g transform="translate(232,208)" opacity="0.50">
      <g transform="rotate(5)"><ellipse cx="0" cy="-6" rx="5.5" ry="3.5" fill="#FFD0DC"/></g>
      <g transform="rotate(77)"><ellipse cx="0" cy="-6" rx="5.5" ry="3.5" fill="#FFD0DC"/></g>
      <g transform="rotate(149)"><ellipse cx="0" cy="-6" rx="5.5" ry="3.5" fill="#FFD0DC"/></g>
      <g transform="rotate(221)"><ellipse cx="0" cy="-6" rx="5.5" ry="3.5" fill="#FFD0DC"/></g>
      <g transform="rotate(293)"><ellipse cx="0" cy="-6" rx="5.5" ry="3.5" fill="#FFD0DC"/></g>
      <circle r="2" fill="#FF8FA3"/>
    </g>

    <!-- ── Motion trails (dashed arcs from each card to the box opening) ── -->
    <path d="M 72,100 C 80,130 100,155 124,168"
          stroke="#60A5FA" stroke-width="1.8" fill="none"
          stroke-dasharray="4,6" stroke-opacity="0.40" stroke-linecap="round"/>
    <path d="M 184,86 C 178,118 160,148 134,166"
          stroke="#D8B4FE" stroke-width="1.8" fill="none"
          stroke-dasharray="4,6" stroke-opacity="0.40" stroke-linecap="round"/>
    <path d="M 152,140 C 146,152 138,160 130,167"
          stroke="#FCA5A5" stroke-width="1.4" fill="none"
          stroke-dasharray="3,5" stroke-opacity="0.35" stroke-linecap="round"/>

    <!-- Trail dots: book -->
    <circle cx="86"  cy="120" r="2.2" fill="#60A5FA" opacity="0.30"/>
    <circle cx="102" cy="142" r="1.7" fill="#60A5FA" opacity="0.20"/>
    <circle cx="114" cy="158" r="1.2" fill="#60A5FA" opacity="0.14"/>
    <!-- Trail dots: movie -->
    <circle cx="172" cy="106" r="2.2" fill="#D8B4FE" opacity="0.30"/>
    <circle cx="156" cy="132" r="1.7" fill="#D8B4FE" opacity="0.20"/>
    <circle cx="144" cy="152" r="1.2" fill="#D8B4FE" opacity="0.14"/>

    <!-- ── BOOK card (far – large, upper-left, tilted left) ── -->
    <g transform="translate(46,68) rotate(-14)" filter="url(#cardShadow)">
      <rect width="50" height="68" rx="9" fill="url(#bookG)"/>
      <!-- Shine top -->
      <rect width="50" height="22" rx="9" fill="white" opacity="0.10"/>
      <!-- Book icon: open pages -->
      <rect x="5"  y="11" width="17" height="22" rx="2.5" fill="white" opacity="0.92"/>
      <rect x="28" y="11" width="17" height="22" rx="2.5" fill="white" opacity="0.92"/>
      <!-- Page lines left -->
      <rect x="7"  y="15" width="12" height="1.8" rx="1" fill="#3B82F6" opacity="0.45"/>
      <rect x="7"  y="19" width="12" height="1.8" rx="1" fill="#3B82F6" opacity="0.45"/>
      <rect x="7"  y="23" width="9"  height="1.8" rx="1" fill="#3B82F6" opacity="0.45"/>
      <!-- Page lines right -->
      <rect x="30" y="15" width="12" height="1.8" rx="1" fill="#3B82F6" opacity="0.45"/>
      <rect x="30" y="19" width="12" height="1.8" rx="1" fill="#3B82F6" opacity="0.45"/>
      <rect x="30" y="23" width="9"  height="1.8" rx="1" fill="#3B82F6" opacity="0.45"/>
      <!-- Spine -->
      <rect x="22.5" y="10" width="5" height="24" rx="2" fill="white" opacity="0.55"/>
      <!-- Bottom bar -->
      <rect x="0" y="55" width="50" height="13" rx="0 0 9 9" fill="#1E40AF" opacity="0.35"/>
      <text x="25" y="66" text-anchor="middle" font-size="7" font-family="sans-serif"
            font-weight="700" fill="white" opacity="0.75">BOOK</text>
    </g>

    <!-- ── MOVIE card (medium – upper-right, medium size) ── -->
    <g transform="translate(175,62) rotate(20)" filter="url(#cardShadow)">
      <rect width="44" height="58" rx="9" fill="url(#movieG)"/>
      <!-- Shine -->
      <rect width="44" height="20" rx="9" fill="white" opacity="0.10"/>
      <!-- Film strip top -->
      <rect x="4"  y="5" width="7" height="7" rx="1.5" fill="white" opacity="0.40"/>
      <rect x="14" y="5" width="7" height="7" rx="1.5" fill="white" opacity="0.40"/>
      <rect x="24" y="5" width="7" height="7" rx="1.5" fill="white" opacity="0.40"/>
      <rect x="34" y="5" width="6" height="7" rx="1.5" fill="white" opacity="0.40"/>
      <!-- Play circle -->
      <circle cx="22" cy="33" r="12" fill="white" opacity="0.18"/>
      <circle cx="22" cy="33" r="10" fill="white" opacity="0.88"/>
      <polygon points="19,28 19,38 28,33" fill="#7C3AED" opacity="0.88"/>
      <!-- Bottom bar -->
      <rect x="0" y="46" width="44" height="12" rx="0 0 9 9" fill="#5B21B6" opacity="0.40"/>
      <text x="22" y="56" text-anchor="middle" font-size="6.5" font-family="sans-serif"
            font-weight="700" fill="white" opacity="0.75">FILM</text>
    </g>

    <!-- ── DRAMA card (close – small, more rotated, near box) ── -->
    <g transform="translate(148,132) rotate(28)" filter="url(#cardShadow)">
      <rect width="32" height="42" rx="6" fill="url(#dramaG)"/>
      <!-- Shine -->
      <rect width="32" height="14" rx="6" fill="white" opacity="0.10"/>
      <!-- TV screen -->
      <rect x="3" y="6" width="26" height="18" rx="3" fill="white" opacity="0.90"/>
      <!-- Screen content -->
      <rect x="5" y="9"  width="14" height="2" rx="1" fill="#EF4444" opacity="0.5"/>
      <rect x="5" y="13" width="10" height="2" rx="1" fill="#EF4444" opacity="0.5"/>
      <!-- Antenna -->
      <line x1="11" y1="6" x2="8"  y2="2" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
      <line x1="21" y1="6" x2="24" y2="2" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
      <!-- Stand -->
      <rect x="12" y="24" width="8" height="3" rx="1.5" fill="white" opacity="0.55"/>
      <rect x="9"  y="27" width="14" height="2.5" rx="1" fill="white" opacity="0.50"/>
      <!-- Bottom bar -->
      <rect x="0" y="33" width="32" height="9" rx="0 0 6 6" fill="#991B1B" opacity="0.35"/>
      <text x="16" y="40.5" text-anchor="middle" font-size="5.5" font-family="sans-serif"
            font-weight="700" fill="white" opacity="0.75">TV</text>
    </g>

    <!-- ── BOX ── -->

    <!-- Opening glow (behind the box rim) -->
    <ellipse cx="128" cy="167" rx="66" ry="20" fill="url(#openGlow)" filter="url(#glowBlur)"/>

    <!-- Box interior (visible through the opening) -->
    <polygon points="72,167 184,167 204,150 52,150" fill="url(#interior)"/>

    <!-- Interior sparkles/particles -->
    <circle cx="104" cy="157" r="2"   fill="white" opacity="0.55" filter="url(#softGlow)"/>
    <circle cx="128" cy="153" r="2.5" fill="white" opacity="0.50" filter="url(#softGlow)"/>
    <circle cx="152" cy="158" r="2"   fill="white" opacity="0.50" filter="url(#softGlow)"/>
    <circle cx="170" cy="155" r="1.5" fill="white" opacity="0.40"/>
    <circle cx="90"  cy="160" r="1.5" fill="white" opacity="0.40"/>
    <circle cx="140" cy="162" r="1"   fill="white" opacity="0.35"/>

    <!-- Box front face -->
    <polygon points="72,167 184,167 184,220 72,220" fill="url(#boxFront)"/>

    <!-- Front face vertical sheen (left lighter) -->
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="white" stop-opacity="0.07"/>
      <stop offset="40%"  stop-color="white" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <polygon points="72,167 184,167 184,220 72,220" fill="url(#sheen)"/>

    <!-- Box right face -->
    <polygon points="184,167 204,150 204,203 184,220" fill="url(#boxRight)"/>

    <!-- Top back face (thin rim at very top) -->
    <polygon points="52,150 204,150 204,153 52,153" fill="#253660"/>

    <!-- Left side rim -->
    <polygon points="52,150 72,167 72,172 52,155" fill="#1C2A4E"/>

    <!-- Right side rim -->
    <polygon points="184,167 204,150 204,153 184,170" fill="#131E38"/>

    <!-- Top opening rim highlight (bright blue-white line) -->
    <line x1="52"  y1="150" x2="204" y2="150" stroke="#7EB5FF" stroke-width="2.2" opacity="0.80"/>
    <line x1="52"  y1="150" x2="72"  y2="167" stroke="#5A8FCC" stroke-width="1.5" opacity="0.60"/>
    <line x1="204" y1="150" x2="184" y2="167" stroke="#5A8FCC" stroke-width="1.5" opacity="0.60"/>

    <!-- Box front bottom shadow line -->
    <line x1="72" y1="220" x2="184" y2="220" stroke="#060E20" stroke-width="1.8" opacity="0.85"/>

    <!-- Box outline edges -->
    <polygon points="72,167 184,167 184,220 72,220"
             fill="none" stroke="#0A1428" stroke-width="1.2" stroke-linejoin="round"/>
    <polygon points="184,167 204,150 204,203 184,220"
             fill="none" stroke="#070F20" stroke-width="1" stroke-linejoin="round"/>
  </g>
</svg>
</body>
</html>
